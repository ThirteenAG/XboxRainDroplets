name: GitHub Actions Build

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-2025-vs2026
    strategy:
      matrix:
        buildtype: [Release]

    steps:
      - name: setup-msbuild
        uses: microsoft/setup-msbuild@main
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Configure build
        shell: cmd
        run: ./premake5.bat
      - name: Build XboxRainDroplets
        shell: cmd
        run: |
          msbuild -m build/${{github.event.repository.name}}.slnx /property:Configuration=${{matrix.buildtype}} /property:Platform=Win32
          msbuild -m build/${{github.event.repository.name}}64.slnx /property:Configuration=${{matrix.buildtype}} /property:Platform=x64
      - name: Build XboxRainDropletsWrapper
        shell: cmd
        run: |
          msbuild -m build/XboxRainDropletsWrapper.slnx /property:Configuration=${{matrix.buildtype}} /property:Platform=Win32
          msbuild -m build/XboxRainDropletsWrapper64.slnx /property:Configuration=${{matrix.buildtype}} /property:Platform=x64
      - name: Build XboxRainDropletsTests
        shell: cmd
        run: msbuild -m build/XboxRainDropletsTests.slnx /property:Configuration=${{matrix.buildtype}} /property:Platform=Win32
      - name: Test renderers
        shell: cmd
        run: |
          rem The runner has no graphics card, so only the renderers that can use
          rem the WARP software rasterizer are run here; the others need a real
          rem driver and are run by hand on a machine that has one.
          setlocal enabledelayedexpansion
          if not exist bin\tests\headless mkdir bin\tests\headless
          set FAILED=0
          for %%t in (D3D10 D3D11) do (
            echo ==================== %%t ====================
            bin\tests\XrdTest%%t.exe --headless --frames 240 --screenshot bin\tests\headless\%%t
            set CODE=!errorlevel!
            if !CODE! equ 0 (echo %%t: passed) else if !CODE! equ 2 (echo %%t: skipped - no usable device or driver on this machine) else (echo %%t: FAILED ^(exit !CODE!^) & set FAILED=1)
          )
          if !FAILED! neq 0 (echo one or more renderer tests failed & exit /b 1)
      - name: Upload test pictures
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: renderer-tests
          path: bin/tests/headless/*.png
      - name: Download Ultimate ASI Loader x86
        uses: robinraju/release-downloader@v1.13
        with:
          repository: "ThirteenAG/Ultimate-ASI-Loader"
          tag: "Win32-latest"
          fileName: "version-Win32.zip"
      - name: Download Ultimate ASI Loader x64
        uses: robinraju/release-downloader@v1.13
        with:
          repository: "ThirteenAG/Ultimate-ASI-Loader"
          tag: "x64-latest"
          fileName: "dinput8-x64.zip"
      - name: Download XboxRainDroplets Plugins
        uses: robinraju/release-downloader@v1.13
        with:
          repository: "ThirteenAG/WidescreenFixesPack"
          tag: "xrd"
          fileName: "*"
      - name: Unpack dependencies
        run: |
          7z x version-Win32.zip -obin/ -y
          7z x dinput8-x64.zip -obin/ -y
          7z x PCSX2F.XboxRainDroplets.zip -obin/ -y
          7z x PPSSPP.XboxRainDroplets.zip -obin/ -y
          del version-Win32.zip
          del dinput8-x64.zip
          del PCSX2F.XboxRainDroplets.zip
          del PPSSPP.XboxRainDroplets.zip
      - name: Pack binaries
        shell: cmd
        run: release.bat
        env:
          CODE_SIGNING_PFX: ${{ github.event_name == 'push' && github.ref_name == 'master' && secrets.CODE_SIGNING_PFX || '' }}
          CODE_SIGNING_PASSWORD: ${{ github.event_name == 'push' && github.ref_name == 'master' && secrets.CODE_SIGNING_PASSWORD || '' }}
      - name: Install artifact client
        shell: cmd
        run: |
          npm install @actions/artifact
      - name: Upload individual zip artifacts
        uses: actions/github-script@v9
        with:
          script: |
            const {DefaultArtifactClient} = require('./node_modules/@actions/artifact')
            const client = new DefaultArtifactClient()
            const path = require('path')
            const globber = await glob.create('bin/*.zip')
            const files = await globber.glob()
            if (files.length === 0) {
              core.warning('No .zip files found in bin.')
              return
            }
            for (const file of files) {
              const name = path.basename(file)
              core.info(`Uploading ${name}...`)
              await client.uploadArtifact(name, [file], 'bin', { retentionDays: 90, skipArchive: true })
            }
      - name: Update Tags
        continue-on-error: true
        if: ${{ github.event_name == 'push' && github.ref_name == 'master' }}
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const sha = process.env.GITHUB_SHA
            if (!sha) {
              core.setFailed('Missing GITHUB_SHA')
              return
            }

            const tags = await github.paginate(github.rest.repos.listTags, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            })

            if (!tags.length) {
              core.info('No tags found to update.')
              return
            }

            for (const tag of tags) {
              const tagName = tag.name
              core.info(`Updating ${tagName} -> ${sha}`)
              await github.rest.git.updateRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tagName}`,
                sha,
                force: true
              })
            }
      - name: GTA3.XboxRainDroplets
        uses: ./.github/workflows/release_tag
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: gta3
          bodyFile: .github/docs/gta3.md
          artifacts: bin/GTA3.XboxRainDroplets.zip
      - name: GTAVC.XboxRainDroplets
