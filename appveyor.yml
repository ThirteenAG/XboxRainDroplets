version: 1.{build}
skip_tags: true
image: Visual Studio 2026
configuration: Release
init:
- ps: ''
install:
- cmd: >-
    git submodule update --init --recursive

    premake5.bat
before_build:
- ps: >-
    msbuild -m build/FusionRainDropletsTools.slnx /property:Configuration=Release /property:Platform=Win32

    msbuild -m build/FusionRainDropletsWrapper.slnx /property:Configuration=Release /property:Platform=Win32

    msbuild -m build/FusionRainDropletsWrapper64.slnx /property:Configuration=Release /property:Platform=x64

    msbuild -m build/FusionRainDroplets64.slnx /property:Configuration=Release /property:Platform=x64

    msbuild -m build/console/FusionRainDropletsPS2.slnx /property:Configuration=Release /property:Platform=PS2

    msbuild -m build/console/FusionRainDropletsPSP.slnx /property:Configuration=Release /property:Platform=PSP


    Start-FileDownload https://github.com/ThirteenAG/Ultimate-ASI-Loader/releases/download/Win32-latest/version-Win32.zip

    Start-FileDownload https://github.com/ThirteenAG/Ultimate-ASI-Loader/releases/download/x64-latest/dinput8-x64.zip

build:
  project: build/FusionRainDroplets.slnx
  verbosity: minimal
before_package:
- cmd: >-
    7z x version-Win32.zip -obin/ -y

    7z x dinput8-x64.zip -obin/ -y

    del version-Win32.zip

    del dinput8-x64.zip



    release.bat
after_build:
- ps: Get-ChildItem .\bin\*.zip  | % { Push-AppveyorArtifact $_.FullName -FileName $_.Name }